name: Post Hogwarts Phone Activity button

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-button:
    runs-on: ubuntu-latest
    steps:
      - name: Post the Activity launch button
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: "1573454056117239999"
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "::error::Missing repository secret DISCORD_BOT_TOKEN"
            exit 1
          fi

          BODY='{"content":"**HOGWARTS PHONE**\nRetrouvez votre espace Poudlard directement depuis Discord. 🪄","components":[{"type":1,"components":[{"type":2,"style":1,"label":"Ouvrir Hogwarts Phone","custom_id":"open_hogwarts_phone","emoji":{"name":"🪄"}}]}]}'

          curl --fail-with-body --silent --show-error \
            -X POST "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_ID/messages" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY"

          echo
          echo "Hogwarts Phone Activity button posted."
