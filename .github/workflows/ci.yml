name: Build check

on:
  push:
    branches:
      - setup/base-application
      - rebuild/foundation
  pull_request:
    branches:
      - setup/base-application

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
